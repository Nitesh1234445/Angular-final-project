<div class="tcard">
  <div class="rating">★ {{ item.rating }}</div>
  <p class="text">{{ item.text }}</p>
  <div class="user">
    <img [src]="item.avatar" alt="{{item.name}}">
    <div>
      <div class="name">{{ item.name }}</div>
      <div class="aff">{{ item.affiliation }}</div>
    </div>
  </div>
</div>
