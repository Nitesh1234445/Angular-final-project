<div class="blog">
  <div class="top">
    <img [src]="item.image" alt="blog" />
  </div>
  <div class="bottom">
    <div class="title">{{ item.title }}</div>
    <div class="excerpt">{{ item.excerpt }}</div>
    <div class="author">
      <img src="https://i.pravatar.cc/32?img=8" alt="author">
      <div>
        <div class="name">{{ item.author }}</div>
        <div class="role">{{ item.role }} • ★ {{ item.rating }} ({{ item.reviews | number }} reviews)</div>
      </div>
    </div>
  </div>
</div>
